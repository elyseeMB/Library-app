name: "DEPLOY FRONTEND"

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm & Node
        uses: ./.github/actions/setup
        with:
          filter: "@root/frontend"
      - name: Build
        run: pnpm --filter @root/frontend build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
      - name: Deploy
        run: pnpm --filter @root/frontend exec wrangler pages deploy dist --project-name=library-eembouz-com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
