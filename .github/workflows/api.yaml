name: "DEPLOY API"

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm & Node
        uses: ./.github/actions/setup
        with:
          filter: "@root/api"
      - name: Run migrations
        run: pnpm --filter @root/api db:migrate
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::528049653207:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}
      - name: Login
        run: |
          aws ecr-public get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin public.ecr.aws
      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: sam build
      - name: Deploy
        run: |
          sam deploy \
            --stack-name library-api \
            --resolve-s3 \
            --resolve-image-repos \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --region ${{ env.AWS_REGION }}

    frontend:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v4
        - name: Setup pnpm & Node
          uses: ./.github/actions/setup
          with:
            filter: "@root/frontend"
        - name: Build
          run: pnpm --filter @root/frontend build
        - uses: "cloudflare/wrangler-action@v3"
          with:
            apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            command: pages deploy dist --project-name=library-eembouz-com
            gitHubToken: ${{ secrets.GITHUB_TOKEN }}
