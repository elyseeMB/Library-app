<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard · hx-boost</title>
    <link rel="stylesheet" href="../src/css/style.css">
  </head>

  <body hx-boost="true" hx-target="#main" hx-select="#main" hx-swap="outerHTML">
    <div class="Layout">
      <aside class="LayoutSidebar">
        <button type="button">Logo</button>

        <nav class="LayoutSidebar__navbar">
          <a
            class="SidebarItem flex middle gap-12 py-8 px-12 text-buttonL color-500"
            href="/"
            aria-current="page"
            >Accueil</a
          >
          <a
            class="SidebarItem flex middle gap-12 py-8 px-12 text-buttonL color-500"
            href="/pages/dashboard.html"
            >Dashboard</a
          >
          <a
            class="SidebarItem flex middle gap-12 py-8 px-12 text-buttonL color-500"
            href="/pages/profile.html"
            >Profil</a
          >
        </nav>
      </aside>
      <header class="LayoutHeader py-12 px-32">
        <div class="flex between">
          <div class="flex gap-24">
            <input type="search" name="search" id="">
          </div>
          <div class="flex gap-16 py-6 pr-6">
            <button type="button">hello word</button>
          </div>
        </div>
      </header>

      <main class="LayoutMain" id="main">
        <h1>Dashboard</h1>
        <p>Statistiques de la bibliothèque (contenu de démonstration).</p>
        <div class="grid">
          <article class="card">
            <strong>128</strong>
            <span>Livres</span>
          </article>
          <article class="card">
            <strong>14</strong>
            <span>Emprunts en cours</span>
          </article>
          <article class="card">
            <strong>36</strong>
            <span>Membres actifs</span>
          </article>
        </div>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
