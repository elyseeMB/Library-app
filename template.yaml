AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Library API

Globals:
  Function:
    Timeout: 30
    MemorySize: 512

Resources:
  ExpressApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures:
        - x86_64
      Environment:
        Variables:
          NODE_ENV: production
          NEON_DATABASE_URL_PARAM: /library-api/prod/neon-database-url
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: library-api/prod/*
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ./
      DockerTag: latest

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DisableExecuteApiEndpoint: true
      Domain:
        DomainName: api.library.eembouz.com
        CertificateArn: arn:aws:acm:us-east-1:528049653207:certificate/077d8e4d-9992-46c5-b379-778b38e20a76
        EndpointConfiguration: REGIONAL
      CorsConfiguration:
        AllowOrigins:
          - "https://library.eembouz.com"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowCredentials: true
